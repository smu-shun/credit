name: Build and deploy fullstack app to Azure Web App – creditwhisperers

on:
  push:
    branches:
      - oliver-test-again
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node (for React build)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Build frontend
      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # 4️⃣ Copy frontend build into backend/static
      - name: Copy React build to backend/static
        run: |
          mkdir -p ./backend/static
          cp -r ./frontend/build/* ./backend/static/

      # 5️⃣ Setup Python for backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 6️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 7️⃣ Prepare deployment package (flatten structure)
      - name: Prepare deployment package
        run: |
          mkdir -p ./deploy-package
          cp -r ./backend/* ./deploy-package/
          rm -rf ./deploy-package/antenv
          ls -la ./deploy-package

      # 8️⃣ Upload artifact for deployment
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: ./deploy-package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 9️⃣ Download artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app
          path: .

      # 1️⃣1️⃣ Debug: inspect structure (optional)
      - name: Inspect deployment package
        run: |
          echo "Verifying files before deployment..."
          ls -R | head -n 100

      # 1️⃣2️⃣ Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_876BADC4E7DA41FCA7DA6D0B5B5EBB75 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_235C2FC19D404939BDC4EA69C46C3133 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6E3707AC40E488CAE0F182286BB105B }}

      # 1️⃣3️⃣ Deploy backend (Python)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "creditwhisperers"
          slot-name: "Production"
          package: "."
          startup-command: "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

