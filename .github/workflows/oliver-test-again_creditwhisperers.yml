name: Build and deploy fullstack app to Azure Web App – creditwhisperers

on:
  push:
    branches:
      - oliver-test-again
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node (for React build)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Build frontend
      - name: Install and build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: |
          npm ci
          npm run build

      # 4️⃣ Copy frontend build into backend/static
      - name: Copy React build to backend/static
        run: |
          mkdir -p ./backend/static
          cp -r ./frontend/build/* ./backend/static/

      # 5️⃣ Setup Python for backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 6️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 7️⃣ Prepare deployment package (flatten structure)
      - name: Prepare deployment package
        run: |
          mkdir -p ./deploy-package

          # Copy essential files and directories
          cp -r ./backend/app ./deploy-package/
          cp -r ./backend/static ./deploy-package/ 2>/dev/null || echo "No static directory yet"
          cp ./backend/requirements.txt ./deploy-package/
          cp ./backend/startup.txt ./deploy-package/
          cp ./backend/runtime.txt ./deploy-package/
          cp ./backend/__init__.py ./deploy-package/ 2>/dev/null || true

          # Copy scripts directory if needed for production
          cp -r ./backend/scripts ./deploy-package/ 2>/dev/null || true

          echo "=== Deploy package contents ==="
          ls -la ./deploy-package
          echo ""
          echo "=== Verifying critical files ==="
          if [ -f "./deploy-package/requirements.txt" ]; then
            echo "✓ requirements.txt present"
          else
            echo "✗ requirements.txt MISSING"
            exit 1
          fi
          if [ -d "./deploy-package/app" ]; then
            echo "✓ app directory present"
          else
            echo "✗ app directory MISSING"
            exit 1
          fi
          if [ -d "./deploy-package/static" ]; then
            echo "✓ static directory present (frontend)"
            ls ./deploy-package/static | head -10
          fi

      # 8️⃣ Upload artifact for deployment
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: ./deploy-package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 9️⃣ Download artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app
          path: ./downloaded

      # 🔟 Move files to root if needed
      - name: Prepare files for deployment
        run: |
          echo "=== Downloaded artifact structure ==="
          ls -la ./downloaded
          echo ""
          # Move all files from downloaded to current directory
          mv ./downloaded/* ./downloaded/.[!.]* . 2>/dev/null || mv ./downloaded/* . 2>/dev/null || true
          rm -rf ./downloaded
          echo "=== Root level after preparation ==="
          ls -la

      # 1️⃣1️⃣ Verify deployment structure
      - name: Verify deployment structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Checking for Python files at root ==="
          if [ -f "requirements.txt" ]; then
            echo "✓ requirements.txt found at root"
            echo "First 5 lines of requirements.txt:"
            head -5 requirements.txt
          else
            echo "✗ requirements.txt NOT found at root - DEPLOYMENT WILL FAIL"
            exit 1
          fi
          if [ -f "startup.txt" ]; then
            echo "✓ startup.txt found at root"
          fi
          if [ -d "app" ]; then
            echo "✓ app directory found at root"
            ls -la app/ | head -20
          else
            echo "✗ app directory NOT found at root - DEPLOYMENT WILL FAIL"
            exit 1
          fi
          if [ -d "static" ]; then
            echo "✓ static directory found (frontend build)"
          fi
          echo ""
          echo "=== All files in deployment package ==="
          find . -type f -name "*.py" -o -name "*.txt" -o -name "*.json" | head -50

      # 1️⃣2️⃣ Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_876BADC4E7DA41FCA7DA6D0B5B5EBB75 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_235C2FC19D404939BDC4EA69C46C3133 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6E3707AC40E488CAE0F182286BB105B }}

      # 1️⃣3️⃣ Deploy backend (Python)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "creditwhisperers"
          slot-name: "Production"
          package: "."
          startup-command: "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

