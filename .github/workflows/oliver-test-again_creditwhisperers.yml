# =============================================
# Deploy FULL STACK (React + Python FastAPI)
# to Azure Web App: creditwhisperers
# =============================================
# This workflow:
# 1️⃣ Builds the React frontend
# 2️⃣ Copies the build into backend/static
# 3️⃣ Installs Python dependencies
# 4️⃣ Deploys backend + frontend together to Azure
# =============================================

name: Build and deploy fullstack app (React + FastAPI) to Azure Web App - creditwhisperers

on:
  push:
    branches:
      - oliver-test-again
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Step 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # Step 2️⃣ Setup Node.js for frontend build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3️⃣ Install and build frontend
      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: |
          npm install
          npm run build

      # Step 4️⃣ Copy built frontend into backend/static
      - name: Copy frontend build into backend static folder
        run: |
          mkdir -p ./backend/static
          cp -r ./frontend/build/* ./backend/static/

      # Step 5️⃣ Setup Python for backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 6️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 7️⃣ Upload build artifact for deploy step
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: |
            ./backend
            !./backend/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 8️⃣ Download artifact from build job
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app

      # Step 9️⃣ Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_876BADC4E7DA41FCA7DA6D0B5B5EBB75 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_235C2FC19D404939BDC4EA69C46C3133 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6E3707AC40E488CAE0F182286BB105B }}

      # Step 🔟 Deploy to Azure Web App
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'creditwhisperers'
          slot-name: 'Production'
          package: './backend'

