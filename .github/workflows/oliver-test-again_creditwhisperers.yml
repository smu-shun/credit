# =============================================
# FULL STACK DEPLOYMENT (React + FastAPI)
# Both frontend and backend in same repo
# =============================================

name: Build and deploy fullstack app (React + FastAPI) to Azure Web App - creditwhisperers

on:
  push:
    branches:
      - oliver-test-again
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Step 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # Step 2️⃣ Setup Node.js for frontend build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3️⃣ Build frontend
      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false  # Don’t treat lint warnings as build-breaking
        run: |
          npm install
          npm run build

      # Step 4️⃣ Copy frontend build into backend/static
      - name: Copy frontend build into backend static folder
        run: |
          mkdir -p ./backend/static
          cp -r ./frontend/build/* ./backend/static/

      # Step 5️⃣ Setup Python for backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 6️⃣ Install backend dependencies
      # Since your requirements.txt is in ROOT, not backend
      - name: Install backend dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 7️⃣ Upload artifact for deployment
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app

      - name: Show downloaded files
        run: |
          pwd
          ls -R | head -n 100

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_876BADC4E7DA41FCA7DA6D0B5B5EBB75 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_235C2FC19D404939BDC4EA69C46C3133 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6E3707AC40E488CAE0F182286BB105B }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'creditwhisperers'
          slot-name: 'Production'
          package: '.'
