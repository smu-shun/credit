name: Build and deploy fullstack app to Azure Web App – creditwhisperers

on:
  push:
    branches:
      - oliver-test-again
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node (for React build)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Build frontend
      - name: Install and build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: |
          npm ci
          npm run build

      # 4️⃣ Copy frontend build into backend/static
      - name: Copy React build to backend/static
        run: |
          mkdir -p ./backend/static
          cp -r ./frontend/build/* ./backend/static/

      # 5️⃣ Setup Python for backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 6️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 7️⃣ Prepare deployment package (flatten structure)
      - name: Prepare deployment package
        run: |
          mkdir -p ./deploy-package

          # Copy essential files and directories (preserving all __init__.py files)
          cp -r ./backend/app ./deploy-package/
          cp -r ./backend/static ./deploy-package/ 2>/dev/null || echo "No static directory yet"
          cp ./backend/requirements.txt ./deploy-package/
          cp ./backend/startup.txt ./deploy-package/
          cp ./backend/runtime.txt ./deploy-package/
          cp ./backend/__init__.py ./deploy-package/ 2>/dev/null || true

          # Copy scripts directory if needed for production
          cp -r ./backend/scripts ./deploy-package/ 2>/dev/null || true

          echo "=== Deploy package contents ==="
          ls -la ./deploy-package
          echo ""
          echo "=== Verifying critical files ==="
          if [ -f "./deploy-package/requirements.txt" ]; then
            echo "✓ requirements.txt present"
          else
            echo "✗ requirements.txt MISSING"
            exit 1
          fi
          if [ -d "./deploy-package/app" ]; then
            echo "✓ app directory present"
          else
            echo "✗ app directory MISSING"
            exit 1
          fi

          # CRITICAL: Verify __init__.py files exist (needed for Python packages)
          if [ -f "./deploy-package/app/__init__.py" ]; then
            echo "✓ app/__init__.py present (Python package)"
          else
            echo "✗ app/__init__.py MISSING - DEPLOYMENT WILL FAIL!"
            exit 1
          fi
          if [ -f "./deploy-package/app/api/__init__.py" ]; then
            echo "✓ app/api/__init__.py present"
          fi
          if [ -f "./deploy-package/app/config/__init__.py" ]; then
            echo "✓ app/config/__init__.py present"
          fi

          if [ -d "./deploy-package/static" ]; then
            echo "✓ static directory present (frontend)"
            ls ./deploy-package/static | head -10
          fi

          echo ""
          echo "=== Python package structure verification ==="
          find ./deploy-package -name "__init__.py" | head -20

      # 8️⃣ Upload artifact for deployment
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: ./deploy-package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 9️⃣ Download artifact directly to current directory
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app

      # 🔟 Verify deployment structure
      - name: Verify deployment structure
        run: |
          echo "=== Current directory ==="
          pwd
          ls -la
          echo ""
          echo "=== Checking for Python files at root ==="
          if [ -f "requirements.txt" ]; then
            echo "✓ requirements.txt found at root"
            echo "First 5 lines:"
            head -5 requirements.txt
          else
            echo "✗ requirements.txt NOT found at root"
            echo "Contents of current directory:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          if [ -f "startup.txt" ]; then
            echo "✓ startup.txt found"
            cat startup.txt
          fi

          if [ -f "runtime.txt" ]; then
            echo "✓ runtime.txt found"
            cat runtime.txt
          fi

          if [ -d "app" ]; then
            echo "✓ app directory found at root"
            ls -la app/ | head -10
          else
            echo "✗ app directory NOT found at root"
            exit 1
          fi

          if [ -d "static" ]; then
            echo "✓ static directory found (frontend)"
            du -sh static/
          fi

      # 1️⃣1️⃣ Create explicit ZIP for deployment
      - name: Create deployment ZIP
        run: |
          echo "Creating deployment.zip with correct structure..."
          zip -r deployment.zip . -x "*.git*" "deployment.zip"
          echo "ZIP created. Testing contents..."
          unzip -l deployment.zip | head -30

      # 1️⃣2️⃣ Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_876BADC4E7DA41FCA7DA6D0B5B5EBB75 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_235C2FC19D404939BDC4EA69C46C3133 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6E3707AC40E488CAE0F182286BB105B }}

      # 1️⃣3️⃣ Deploy backend (Python)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "creditwhisperers"
          slot-name: "Production"
          package: "deployment.zip"
          startup-command: "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

